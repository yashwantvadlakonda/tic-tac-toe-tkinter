<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
:root{--bg:#f4f6f8;--text:#333;--card:#fff;--accent:#007bff;--line:#ccc;--x:#e74c3c;--o:#2ecc71;--btn:#007bff;--btntxt:#fff;--modal:rgba(0,0,0,0.5)}
[data-theme="dark"]{--bg:#1e1e2e;--text:#cdd6f4;--card:#11111b;--accent:#89b4fa;--line:#45475a;--x:#f38ba8;--o:#a6e3a1;--btn:#89b4fa;--btntxt:#11111b;--modal:rgba(0,0,0,0.7)}
[data-theme="neon"]{--bg:#050515;--text:#00ffcc;--card:#0d0d2b;--accent:#ff007f;--line:#ff007f;--x:#ff007f;--o:#00ffcc;--btn:#ff007f;--btntxt:#fff;--modal:rgba(5,5,21,0.85)}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.hdr{position:absolute;top:15px;right:20px;display:flex;gap:10px;align-items:center}
.container{width:90%;max-width:480px;background:var(--card);padding:24px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.15);display:flex;flex-direction:column;align-items:center;gap:16px}
h1{font-size:2rem;text-align:center}
.menu{display:flex;flex-direction:column;gap:12px;width:100%}
.fg{display:flex;flex-direction:column;gap:4px}
label{font-size:0.9rem;font-weight:600}
input,select,button{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem}
button.btn-p{background:var(--btn);color:var(--btntxt);border:none;font-weight:bold;cursor:pointer}
button.btn-s{background:transparent;border:1px solid var(--btn);color:var(--text);font-weight:bold;cursor:pointer}
.status{font-size:1.2rem;font-weight:bold;text-align:center}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;aspect-ratio:1}
.cell{background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:bold;cursor:pointer;user-select:none}
.cell.x{color:var(--x)}.cell.o{color:var(--o)}
.hidden{display:none!important}
.overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:var(--modal);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--card);padding:24px;border-radius:12px;text-align:center;width:85%;max-width:360px;display:flex;flex-direction:column;gap:16px}
.m-btns{display:flex;gap:10px}.m-btns button{flex:1}
</style>
</head>
<body>
<div class="hdr"><label>Theme:</label><select id="tSel" onchange="setTheme(this.value)"><option value="classic">Classic</option><option value="dark">Dark</option><option value="neon">Neon</option></select></div>
<div class="container" id="menu">
<h1>Tic-Tac-Toe</h1>
<div class="menu">
<div class="fg"><label>Game Mode</label><select id="gMode" onchange="tMode()"><option value="single">Single Player (vs AI)</option><option value="pvp">Two Players</option></select></div>
<div class="fg" id="diffGroup"><label>AI Difficulty</label><select id="diff"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div>
<div class="fg"><label>Player 1 (X)</label><input type="text" id="p1" value="Player 1"></div>
<div class="fg"><label>Player 2 / AI (O)</label><input type="text" id="p2" value="AI"></div>
<button class="btn-p" onclick="startG()">Start Game</button>
</div>
</div>
<div class="container hidden" id="game">
<div class="status" id="st">Player 1's Turn (X)</div>
<div class="board" id="b">
<div class="cell" onclick="clickC(0)"></div><div class="cell" onclick="clickC(1)"></div><div class="cell" onclick="clickC(2)"></div>
<div class="cell" onclick="clickC(3)"></div><div class="cell" onclick="clickC(4)"></div><div class="cell" onclick="clickC(5)"></div>
<div class="cell" onclick="clickC(6)"></div><div class="cell" onclick="clickC(7)"></div><div class="cell" onclick="clickC(8)"></div>
</div>
<button class="btn-s" style="margin-top:10px;width:100%" onclick="toMenu()">Return to Menu</button>
</div>
<div class="overlay hidden" id="modal">
<div class="modal">
<h2 id="mTitle">Game Over</h2>
<p id="mMsg"></p>
<div class="m-btns"><button class="btn-p" onclick="reG()">Play Again</button><button class="btn-s" onclick="toMenu()">Return to Menu</button></div>
</div>
</div>
<script>
let state=Array(9).fill(''),cur='X',active=false,mode='single',diff='easy',p1='Player 1',p2='AI';
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function setTheme(t){document.documentElement.setAttribute('data-theme',t==='classic'?'':t)}
function tMode(){
  mode=document.getElementById('gMode').value;
  document.getElementById('diffGroup').classList.toggle('hidden',mode==='pvp');
  document.getElementById('p2').value=mode==='single'?'AI':'Player 2';
}
function startG(){
  mode=document.getElementById('gMode').value;
  diff=document.getElementById('diff').value;
  p1=document.getElementById('p1').value.trim()||'Player 1';
  p2=document.getElementById('p2').value.trim()||(mode==='single'?'AI':'Player 2');
  state=Array(9).fill('');cur='X';active=true;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('modal').classList.add('hidden');
  uBoard();uSt();
}
function uSt(){document.getElementById('st').innerText=`${cur==='X'?p1:p2}'s Turn (${cur})`}
function uBoard(){
  document.querySelectorAll('.cell').forEach((c,i)=>{
    c.innerText=state[i];c.className='cell '+(state[i]?state[i].toLowerCase():'');
  });
}
function clickC(i){
  if(!active||state[i]!=='')return;
  doMove(i,cur);
  if(chkEnd())return;
  if(mode==='single'&&cur==='O'){
    active=false;setTimeout(aiMove,300);
  }
}
function doMove(i,p){state[i]=p;uBoard();cur=cur==='X'?'O':'X';uSt();}
function chkEnd(){
  for(let w of wins){
    if(state[w[0]]&&state[w[0]]===state[w[1]]&&state[w[0]]===state[w[2]]){
      active=false;
      let wName=state[w[0]]==='X'?p1:p2;
      showM(`${wName} Wins!`,`Congratulations ${wName}!`);
      return true;
    }
  }
  if(!state.includes('')){
    active=false;showM("It's a Draw!","No more moves left.");return true;
  }
  return false;
}
function showM(t,m){
  document.getElementById('mTitle').innerText=t;
  document.getElementById('mMsg').innerText=m;
  document.getElementById('modal').classList.remove('hidden');
}
function reG(){state=Array(9).fill('');cur='X';active=true;document.getElementById('modal').classList.add('hidden');uBoard();uSt();}
function toMenu(){active=false;document.getElementById('modal').classList.add('hidden');document.getElementById('game').classList.add('hidden');document.getElementById('menu').classList.remove('hidden');}
function aiMove(){
  active=true;let m;
  if(diff==='easy') m=rMove();
  else if(diff==='medium') m=wb('O')??wb('X')??rMove();
  else if(diff==='hard') m=wb('O')??wb('X')??pref()??rMove();
  if(m!=null){doMove(m,'O');chkEnd();}
}
function rMove(){let e=state.map((v,i)=>v===''?i:null).filter(v=>v!==null);return e.length?e[Math.floor(Math.random()*e.length)]:null;}
function wb(p){
  for(let w of wins){
    let l=[state[w[0]],state[w[1]],state[w[2]]];
    if(l.filter(v=>v===p).length===2&&l.filter(v=>v==='').length===1){
      return w[l.indexOf('')];
    }
  }
  return null;
}
function pref(){if(state[4]==='')return 4;let c=[0,2,6,8].filter(i=>state[i]==='');return c.length?c[Math.floor(Math.random()*c.length)]:null;}
</script>
</body>
</html>
